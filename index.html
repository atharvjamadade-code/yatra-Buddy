<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      // Fix: Ensure window.fetch has both a getter and a setter so development environment proxies or injected inspection wrappers do not throw "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var nativeFetch = window.fetch;
          var currentFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Graceful fallback if environment completely locks down window
        }
      })();
    </script>
    <title>Yatra Buddy - Offline Travel Companion for India</title>
